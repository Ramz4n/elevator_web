{% extends 'base.html' %}

{% block content %}
{% set months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'] %}
<div class="filter">
	<label for="cityList" class="customLabel">Город</label>
	<select class="customSelect" id="cityList" autocomplete="off">
		<option value="all"{% if not town %} selected{% endif %}>Все города</option>
		{% for city in data8 %}
		<option value="{{ city }}"{% if city == town %} selected{% endif %}>{{ city }}</option>
		{% endfor %}
	</select>
</div>
<div class="filter">
	<label for="monthList" class="customLabel">Месяц</label>
	<select class="customSelect" id="monthList" autocomplete="off">
		{% for month in months %}
		<option value="{{ loop.index }}"{% if loop.index == selected_month %} selected{% endif %}>{{ month }}</option>
		{% endfor %}
	</select>
</div>
<div class="filter">
	<label for="yearList" class="customLabel">Год</label>
	<select class="customSelect customSelect-short" id="yearList" autocomplete="off">
		{% for year in years %}
		<option value="{{ year }}"{% if year == selected_year %} selected{% endif %}>{{ year }}</option>
		{% endfor %}
	</select>
</div>
{% endblock %}
