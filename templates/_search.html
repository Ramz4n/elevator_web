<script>
function goBack() {
  // Сохранение выбранного значения города в sessionStorage
  sessionStorage.setItem("selectedCity", document.getElementById("cityList").value);
  
  window.history.back();
}

window.onload = function() {
  // Восстановление выбранного значения города из sessionStorage
  var selectedCity = sessionStorage.getItem("selectedCity");
  if (selectedCity) {
    document.getElementById("cityList").value = selectedCity;
  }
};
</script>
<h2 style="text-align: center;"> 
<div style='margin-bottom: 5px; margin-top: 5pt;'>
<button class="btn btn-success" onclick="goBack()">Назад</button> Поиск заявок
</div>

<script>
        let results = [];

        function selectResult(result) {
            document.getElementById('adresList').value = result; // Устанавливаем выбранное значение в input
            document.getElementById('results').style.display = 'none'; // Скрываем результаты
        }

        // Закрытие выпадающего списка при клике вне его
        document.addEventListener('click', function(event) {
            const resultsContainer = document.getElementById('results');
            if (!resultsContainer.contains(event.target) && event.target.id !== 'adresList') {
                resultsContainer.style.display = 'none';
            }
        });

        function postbutton() {
          var adresList = document.getElementById('adresList').value;
          var cityList = document.getElementById('cityList').value;
            fetch('/_search', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ adresList: adresList, cityList: cityList })
            })
          .then(response => response.json())
          .then(data => {
            updateTableData(data);
          });
        }

        function updateTableData(data) {
          document.getElementById('data1').textContent = data.data1[0][0];
          document.getElementById('data2').textContent = data.data1[0][1];
          document.getElementById('data3').textContent = data.data1[0][2];
          document.getElementById('data4').textContent = data.data1[0][3];
          document.getElementById('data5').textContent = data.data1[0][4];
          document.getElementById('data6').textContent = data.data1[0][5];
          document.getElementById('data7').textContent = data.data1[0][6];

           const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';

            if (!data || !Array.isArray(data.data2)) {
                console.error("Invalid data format:", data);
                return;
            }

            data.data2.forEach((row) => {
                if (!Array.isArray(row)) {
                    console.error("Invalid row:", row);
                    return;
                }

                const tr = document.createElement('tr'); // Создаем строку таблицы

                row.forEach((cell) => {
                    const td = document.createElement('td'); // Создаем ячейку
                    td.textContent = cell; // Добавляем данные
                    tr.appendChild(td); // Добавляем ячейку в строку
                });

                tbody.appendChild(tr); // Добавляем строку в таблицу
            });
        }
</script>

<script>
function get_addresses_by_city() {
    const city = document.getElementById('cityList').value;

    fetch('/get_addresses_by_city', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ cityList: city })
    })
    .then(response => response.json())
    .then(results => {
        // Отображаем результаты
        const resultsContainer = document.getElementById('results');
        resultsContainer.innerHTML = '';

        if (results.length > 0) {
            results.forEach(result => {
                const div = document.createElement('div');
                div.textContent = result;
                div.classList.add('result-item');
                div.onclick = () => selectResult(result);
                resultsContainer.appendChild(div);
            });
            resultsContainer.style.display = 'block';
        } else {
            resultsContainer.style.display = 'none';
        }
    })
    .catch(error => {
        console.error('Ошибка:', error);
    });
}
</script>


<div class="search-container">
    <form action="/_search" method="post" class="form-horizontal">

        <div class="form-group">
            <label for="cityList" class="customLabel">Город:</label>
            <select class="customSelect" name="city" id="cityList" onchange="get_addresses_by_city()">
                {% for city in town %}
                    <option class="data" value="{{ city }}">{{ city }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="adresList" class="customLabel">Адрес:</label>
            <input type="search" id="adresList" onclick="get_addresses_by_city()" autocomplete="off" placeholder="Ввод">
