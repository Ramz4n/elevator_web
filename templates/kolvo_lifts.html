<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.gstatic.com" />
	<link rel= "stylesheet" type= "text/css" href= "{{ url_for('static',filename='css/app.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <title>Кол-во лифтов</title>
</head>
<body>
  <style>
table {
border-spacing: 0;
empty-cells: hide;
margin: 0 auto;
font-size: 20px;
background-color: white;
}

tr {
  border-bottom: 1px solid #ddd;
}

th, td {
  padding: 15px;
}
.fixed-header {
overflow-x: auto; /* Позволяет прокручивать таблицу горизонтально */
}

.fixed-header thead th {
position: sticky; /* Фиксация заголовков */
top: 0; /* Закрепление заголовков в верхней части окна */
background-color: #63B2F3; /* Цвет фона заголовков */
    </style>
	<script>
function goBack() {
  window.history.back();
}
</script>
	<h2 style="text-align: center"> <button class="btn btn-success" onclick="goBack()">Назад</button>Кол-во лифтов {{ 'всех городов' if (town == 'all' or not town) else 'города ' ~ town }}</h2>
<table class="fixed-header">
  <thead>
    <tr>
      <th>Город</th>
      <th>Улица</th>
      <th>Дом</th>
      <th>Подъезд</th>
      <th>Лифт</th>
    </tr>
  </thead>
  <tbody>
    {%for dat in data1%}
	<tr>
        <td class="data">{{dat[0]}}</td>
        <td class="data">{{dat[1]}}</td>
        <td class="data">{{dat[2]}}</td>
        <td class="data">{{dat[3]}}</td>
        <td class="data">{{dat[4]}}</td>
    </tr>
	{%endfor%}
  </tbody>
</table>
</body>
</html>
