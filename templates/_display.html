<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="canonical" href="https://demo-basic.adminkit.io/" />
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/app.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <title>{%block title%} {%endblock%}</title>
    <style>
        table {
            border-spacing: 0;
            empty-cells: hide;
            margin: 0 auto;
            font-size: 20px;
            background-color: white;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        th, td {
            padding: 15px;
            text-align: center;
            cursor: pointer; /* Курсор указывает на возможность клика */
        }

        .fixed-header {
            width: 100%; /* Ширина таблицы */
            overflow-x: auto; /* Позволяет прокручивать таблицу горизонтально */
        }

        .fixed-header thead th {
            position: sticky; /* Фиксация заголовков */
            top: 0; /* Закрепление заголовков в верхней части окна */
            background-color: #63B2F3; /* Цвет фона заголовков */
        }
    </style>
</head>
<body>
<script>
function goBack() {
    window.history.back();
}

function sortTable(n) {
    const table = document.querySelector(".fixed-header");
    let rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
    switching = true;
    dir = "asc"; // Устанавливаем направление сортировки по возрастанию

    while (switching) {
        switching = false;
        rows = table.rows;

        for (i = 1; i < (rows.length - 1); i++) {
            shouldSwitch = false;
            x = rows[i].getElementsByTagName("TD")[n];
            y = rows[i + 1].getElementsByTagName("TD")[n];

            if (dir === "asc") {
                if (x.innerHTML > y.innerHTML) {
                    shouldSwitch = true;
                    break;
                }
            } else if (dir === "desc") {
                if (x.innerHTML < y.innerHTML) {
                    shouldSwitch = true;
                    break;
                }
            }
        }
        if (shouldSwitch) {
            rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
            switching = true;
            switchcount++; // Увеличиваем счетчик переключений
        } else {
            if (switchcount === 0 && dir === "asc") {
                dir = "desc"; // Меняем направление сортировки на убывание
                switching = true;
            }
        }
    }
}
</script>

<h2 style="text-align: center">
    <button class="btn btn-success" onclick="goBack()">Назад</button>
    {% block content %}{% endblock %}
</h2>

<table class="fixed-header">
    <thead>
        <tr>
            <th onclick="sortTable(0)">№ заявки</th>
            <th onclick="sortTable(1)">Дата заявки</th>
            <th onclick="sortTable(2)">Диспетчер</th>
            <th onclick="sortTable(3)">Город</th>
            <th onclick="sortTable(4)">Адрес</th>
            <th onclick="sortTable(5)">Лифт</th>
            <th onclick="sortTable(6)">Причина</th>
            <th onclick="sortTable(7)">Принял</th>
            <th onclick="sortTable(8)">Дата запуска</th>
            <th onclick="sortTable(9)">Комментарий</th>
        </tr>
    </thead>
    <tbody>
        {% for dat in data1 %}
        <tr {% if dat[6] == "Остановлен" and dat[8] == None %}style="background-color: #FF9999;"{% endif %}>
            <td class="data">{{ dat[0] }}</td>
            <td class="data">{{ dat[1] }}</td>
            <td class="data">{{ dat[2] }}</td>
            <td class="data">{{ dat[3] }}</td>
            <td class="data">{{ dat[4] }}</td>
            <td class="data">{{ dat[5] }}</td>
            <td class="data">{{ dat[6] }}</td>
            <td class="data">{{ dat[7] }}</td>
            <td class="data">{{ dat[8] }}</td>
            <td class="data">{{ dat[9] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
