<script>
function goBack() {
  // Сохранение выбранного значения города в sessionStorage
  sessionStorage.setItem("selectedCity", document.getElementById("cityList").value);
  
  window.history.back();
}

window.onload = function() {
  // Восстановление выбранного значения города из sessionStorage
  var selectedCity = sessionStorage.getItem("selectedCity");
  if (selectedCity) {
    document.getElementById("cityList").value = selectedCity;
  }
};
</script>
<h2 style="text-align: center;"> 
<div style='margin-bottom: 5px; margin-top: 5pt;'>
<button class="btn btn-success" onclick="goBack()">Назад</button> Поиск заявок
</div>

<script>
        let results = [];

        function selectResult(result) {
            document.getElementById('addressesList').value = result; // Устанавливаем выбранное значение в input
            document.getElementById('results').style.display = 'none'; // Скрываем результаты
        }

        // Закрытие выпадающего списка при клике вне его
        document.addEventListener('click', function(event) {
            const resultsContainer = document.getElementById('results');
            if (!resultsContainer.contains(event.target) && event.target.id !== 'addressesList') {
                resultsContainer.style.display = 'none';
            }
        });

        function postbutton() {
            var addressesList = document.getElementById('addressesInput').value;
            var cityList = document.getElementById('cityList').value;

            // Создаем объект с данными
            const data = {
                addresses: addressesList,
                city: cityList
            };
            fetch('/_search', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                updateTableData(data);
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
        }

        function updateTableData(data) {
            // Получаем tbody для добавления данных
            const tbody = document.getElementById('data1');
            tbody.innerHTML = ''; // Очищаем текущее содержимое

            // Проверяем, есть ли данные и являются ли они массивом
            if (!data || !Array.isArray(data.data1)) {
                console.error("Invalid data format:", data);
                return;
            }

            // Проходим по каждой строке данных
            data.data1.forEach((row) => {
                if (!Array.isArray(row)) {
                    console.error("Invalid row:", row);
                    return;
                }

                const tr = document.createElement('tr'); // Создаем новую строку

                row.forEach((cell) => {
                    const td = document.createElement('td'); // Создаем новую ячейку
                    td.textContent = cell; // Устанавливаем текст ячейки
                    tr.appendChild(td); // Добавляем ячейку в строку
                });

                tbody.appendChild(tr); // Добавляем строку в tbody
            });
            }

</script>

<script>
function get_addresses_by_city() {
    const city = document.getElementById('cityList').value;

    fetch('/get_addresses_by_city', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ cityList: city })
    })
    .then(response => response.json())
    .then(results => {
        // Отображаем результаты
        const resultsContainer = document.getElementById('results');
        resultsContainer.innerHTML = '';

        if (results.length > 0) {
            results.forEach(result => {
                const div = document.createElement('div');
                div.textContent = result;
                div.classList.add('result-item');
                div.onclick = () => selectResult(result);
                resultsContainer.appendChild(div);
            });
            resultsContainer.style.display = 'block';
        } else {
            resultsContainer.style.display = 'none';
        }
    })
    .catch(error => {
        console.error('Ошибка:', error);
    });
}
</script>


<div class="search-container">

        <div class="form-group">
